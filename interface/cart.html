<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Корзина — Золотая зебра</title>

  <link rel="stylesheet" href="./style.css">

  <style>
    .cart-page {
      padding: 42px 0 70px;
    }

    .cart-page h1 {
      margin: 0;
      font-size: clamp(36px, 5vw, 58px);
    }

    .cart-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 24px;
      margin-top: 28px;
    }

    .cart-items {
      display: grid;
      gap: 14px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .cart-item-image {
      width: 120px;
      height: 100px;
      overflow: hidden;
      border-radius: 12px;
      background: #eee;
    }

    .cart-item-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cart-item-title {
      margin: 0;
      font-family: var(--sans);
      font-size: 17px;
    }

    .cart-item-price {
      margin-top: 6px;
      color: var(--gold-dark);
      font-size: 18px;
      font-weight: 800;
    }

    .cart-item-actions {
      display: flex;
      align-items: center;
    }

    .cart-quantity {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow: hidden;
      padding: 4px;
      background: var(--gold-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .cart-quantity button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--gold-dark);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 20px;
      font-weight: 600;
      transition:
        color .2s,
        background .2s,
        border-color .2s,
        transform .2s;
    }

    .cart-quantity button:hover {
      color: var(--ink);
      background: var(--gold-light);
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .cart-quantity span {
      min-width: 32px;
      color: var(--ink);
      text-align: center;
      font-weight: 700;
    }

    .cart-undo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 16px;
      padding: 14px 18px;
      color: var(--ink);
      background: var(--gold-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .cart-undo button {
      padding: 7px 12px;
      color: var(--gold-dark);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-weight: 700;
    }

    .cart-undo button:hover {
      color: var(--ink);
      background: var(--gold-light);
      border-color: var(--gold);
    }

    .cart-summary {
      height: max-content;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .cart-summary h2 {
      font-size: 28px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      color: var(--muted);
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 22px;
      font-weight: 800;
    }

    .checkout-button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      color: #fff;
      background: var(--gold);
      border: 0;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .checkout-button:hover {
      background: var(--gold-dark);
    }

    .empty-cart {
      padding: 54px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-align: center;
    }

    .empty-cart h2 {
      font-size: 30px;
    }

    .empty-cart p {
      color: var(--muted);
    }

    .empty-cart a {
      display: inline-flex;
      margin-top: 18px;
    }

    @media (max-width: 800px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }

      .cart-summary {
        order: -1;
      }
    }

    @media (max-width: 560px) {
      .cart-item {
        grid-template-columns: 80px minmax(0, 1fr);
        gap: 12px;
      }

      .cart-item-image {
        width: 80px;
        height: 80px;
      }

      .cart-item-actions {
        grid-column: 1 / -1;
        justify-content: flex-end;
      }

      .cart-item-title {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container">
      <div class="header-main">
        <a class="brand" href="./index.html">
          <img
            class="brand-logo-full"
            src="../images/logo.png"
            alt="Золотая зебра"
          >
        </a>

        <a
          class="catalog-button"
          href="./index.html#hits"
        >
          Продолжить покупки
        </a>
      </div>
    </div>
  </header>

  <main class="cart-page">
    <div class="container">
      <h1>Корзина</h1>

      <div id="cart-page-content"></div>
    </div>
  </main>
 <div id="footer-container"></div>
  <script>
    const products = [
      [
        'Диван «Зебра»',
        'sofa.png',
        89990,
        62990
      ],
      [
        'Кровать «Аристократ» 160×200',
        'bed.png',
        74990,
        52490
      ],
      [
        'Кресло «Адель»',
        'chair.png',
        29990,
        20990
      ],
      [
        'Стул «Золотой»',
        'chair-gold.png',
        8990,
        6290
      ],
      [
        'Шкаф «Версаль»',
        'wardrobe.png',
        109990,
        76990
      ],
      [
        'Кухня «Модерн»',
        'kitchen.png',
        189990,
        132990
      ],
      [
        'Торшер «Шампань»',
        'lamp.png',
        15990,
        11190
      ]
    ];

    const content = document.querySelector(
      '#cart-page-content'
    );

    const formatPrice = (price) => {
      return `${price.toLocaleString('ru-RU')} ₽`;
    };

    let cart = JSON.parse(
      localStorage.getItem('zebraCart') || '{}'
    );

    const removedProducts = new Map();
    const removalTimeouts = new Map();

    const saveCart = () => {
      localStorage.setItem(
        'zebraCart',
        JSON.stringify(cart)
      );
    };

    const calculateCart = () => {
      let count = 0;
      let total = 0;

      Object.entries(cart).forEach(
        ([productIndex, quantity]) => {
          const product =
            products[Number(productIndex)];

          if (!product || quantity <= 0) {
            return;
          }

          count += quantity;
          total += product[3] * quantity;
        }
      );

      return {
        count,
        total
      };
    };

    const renderUndoNotice = () => {
      return Array.from(removedProducts.entries())
        .map(([index]) => `
          <div class="cart-undo" role="status" aria-live="polite">
            <span>${products[index][0]} удалён из корзины.</span>
            <button data-restore="${index}" type="button">Вернуть</button>
          </div>
        `)
        .join('');
    };

    const render = () => {
      const entries = Object.entries(cart)
        .filter(([, quantity]) => quantity > 0);

      if (entries.length === 0) {
        content.innerHTML = `
          ${renderUndoNotice()}
          <div class="empty-cart">
            <h2>Корзина пока пуста</h2>

            <p>
              Добавьте понравившиеся товары,
              и они появятся здесь.
            </p>

            <a class="catalog-button" href="./index.html#hits">
              Перейти к товарам
            </a>
          </div>
        `;

        return;
      }

      const cartData = calculateCart();

      const items = entries
        .map(([key, quantity]) => {
          const index = Number(key);
          const product = products[index];

          return `
            <article
              class="cart-item"
              data-cart-item="${index}"
            >
              <div class="cart-item-image">
                <img
                  src="../images/${product[1]}"
                  alt="${product[0]}"
                  onerror="this.onerror=null; this.src='../images/fallback.png'"
                >
              </div>

              <div>
                <h2 class="cart-item-title">
                  ${product[0]}
                </h2>

                <div class="cart-item-price">
                  ${formatPrice(product[3])}
                </div>
              </div>

              <div class="cart-item-actions">
                <div class="cart-quantity">
                  <button
                    data-minus="${index}"
                    type="button"
                  >
                    −
                  </button>

                  <span>
                    ${quantity}
                  </span>

                  <button
                    data-plus="${index}"
                    type="button"
                  >
                    +
                  </button>
                </div>
              </div>
            </article>
          `;
        })
        .join('');

      content.innerHTML = `
        <div class="cart-layout">
          <div class="cart-items">
            ${items}
          </div>

          <aside class="cart-summary">
            <h2>Ваш заказ</h2>

            <div class="summary-row">
              <span>Товары</span>
              <span>${cartData.count} шт.</span>
            </div>

            <div class="summary-row">
              <span>Доставка</span>
              <span>Рассчитаем позже</span>
            </div>

            <div class="summary-total">
              <span>Итого</span>
              <span>${formatPrice(cartData.total)}</span>
            </div>

            <button
              class="checkout-button"
              id="checkout"
              type="button"
            >
              Перейти к оформлению
            </button>
          </aside>
        </div>
        ${renderUndoNotice()}
      `;
    };

    content.addEventListener('click', (event) => {
      const plusButton =
        event.target.closest('[data-plus]');

      const minusButton =
        event.target.closest('[data-minus]');

      const restoreButton =
        event.target.closest('[data-restore]');

      const checkoutButton =
        event.target.closest('#checkout');

      if (plusButton) {
        const index = plusButton.dataset.plus;

        cart[index] = (cart[index] || 0) + 1;

        saveCart();
        render();

        return;
      }

      if (minusButton) {
        const index = Number(minusButton.dataset.minus);
        const previousQuantity = cart[index] || 0;

        cart[index] = (cart[index] || 0) - 1;

        if (cart[index] <= 0) {
          delete cart[index];
          removedProducts.set(index, previousQuantity);

          window.clearTimeout(removalTimeouts.get(index));
          const timeout = window.setTimeout(() => {
            removedProducts.delete(index);
            removalTimeouts.delete(index);
            render();
          }, 5000);
          removalTimeouts.set(index, timeout);
        }

        saveCart();
        render();

        return;
      }

      if (restoreButton) {
        const index = Number(restoreButton.dataset.restore);
        const quantity = removedProducts.get(index);

        if (quantity === undefined) {
          return;
        }

        window.clearTimeout(removalTimeouts.get(index));
        removalTimeouts.delete(index);
        cart[index] = quantity;
        removedProducts.delete(index);

        saveCart();
        render();

        return;
      }

      if (checkoutButton) {
        alert(
          'Оформление заказа будет доступно после подключения сервера.'
        );
      }
    });

    render();
  </script>
</body>
</html>
