<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Корзина — Золотая зебра</title>

  <link rel="stylesheet" href="./style.css">

  <style>
    .cart-header {
      display: flex !important;
      justify-content: space-between;
    }

    .cart-header .brand {
      order: 0;
    }

    .cart-header-actions {
      order: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .cart-page {
      padding: 42px 0 70px;
    }

    .cart-page h1 {
      margin: 0;
      font-size: clamp(36px, 5vw, 58px);
    }

    .cart-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 24px;
      margin-top: 28px;
    }

    .cart-items {
      display: grid;
      gap: 14px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .cart-item-image {
      width: 120px;
      height: 100px;
      overflow: hidden;
      border-radius: 12px;
      background: #eee;
    }

    .cart-item-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cart-item-title {
      margin: 0;
      font-family: var(--sans);
      font-size: 17px;
    }

    .cart-item-price {
      margin-top: 6px;
      color: var(--gold-dark);
      font-size: 18px;
      font-weight: 800;
    }

    .cart-item-actions {
      display: flex;
      align-items: center;
    }

    .cart-quantity {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow: hidden;
      padding: 4px;
      background: var(--gold-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .cart-quantity button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--gold-dark);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 20px;
      font-weight: 600;
      transition:
        color .2s,
        background .2s,
        border-color .2s,
        transform .2s;
    }

    .cart-quantity button:hover {
      color: var(--ink);
      background: var(--gold-light);
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .cart-quantity span {
      min-width: 32px;
      color: var(--ink);
      text-align: center;
      font-weight: 700;
    }

    .cart-undo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 16px;
      padding: 14px 18px;
      color: var(--ink);
      background: var(--gold-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .cart-undo button {
      padding: 7px 12px;
      color: var(--gold-dark);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-weight: 700;
    }

    .cart-undo button:hover {
      color: var(--ink);
      background: var(--gold-light);
      border-color: var(--gold);
    }

    .cart-summary {
      height: max-content;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .cart-summary h2 {
      font-size: 28px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      color: var(--muted);
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 22px;
      font-weight: 800;
    }

    .checkout-button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      color: #fff;
      background: var(--gold);
      border: 0;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .checkout-button:hover {
      background: var(--gold-dark);
    }

    .empty-cart {
      padding: 54px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-align: center;
    }

    .empty-cart h2 {
      font-size: 30px;
    }

    .empty-cart p {
      color: var(--muted);
    }

    .empty-cart a {
      display: inline-flex;
      margin-top: 18px;
    }

    @media (max-width: 800px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }

      .cart-summary {
        order: -1;
      }
    }

    @media (max-width: 560px) {
      .cart-item {
        grid-template-columns: 80px minmax(0, 1fr);
        gap: 12px;
      }

      .cart-item-image {
        width: 80px;
        height: 80px;
      }

      .cart-item-actions {
        grid-column: 1 / -1;
        justify-content: flex-end;
      }

      .cart-item-title {
        font-size: 15px;
      }
    }

    @media (max-width: 650px) {
      .cart-header .brand-logo-full {
        width: 100px !important;
        max-height: 42px;
      }

      .cart-header-actions {
        gap: 6px;
      }

      .cart-header-actions .catalog-button {
        height: 40px;
        padding: 0 7px;
        font-size: 11px;
      }
    }

    @media (max-width: 360px) {
      .cart-header .brand-logo-full {
        width: 80px !important;
      }

      .cart-header-actions .catalog-button {
        padding: 0 5px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <svg hidden aria-hidden="true">
    <symbol id="home" viewBox="0 0 24 24">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
    </symbol>
    <symbol id="grid" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1" />
      <rect x="14" y="3" width="7" height="7" rx="1" />
      <rect x="3" y="14" width="7" height="7" rx="1" />
      <rect x="14" y="14" width="7" height="7" rx="1" />
    </symbol>
    <symbol id="heart" viewBox="0 0 24 24">
      <path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z" />
    </symbol>
    <symbol id="bag" viewBox="0 0 24 24">
      <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18" />
      <path d="M16 10a4 4 0 0 1-8 0" />
    </symbol>
    <symbol id="user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4" />
      <path d="M4 21a8 8 0 0 1 16 0" />
    </symbol>
  </svg>

  <header class="site-header">
    <div class="container">
      <div class="header-main cart-header">
        <a class="brand" href="./index.html" aria-label="Золотая зебра — главная">
          <img
            class="brand-logo-full"
            src="../images/logo.png"
            alt="Золотая зебра"
          >
        </a>

        <div class="cart-header-actions">
          <a class="catalog-button" href="./index.html#hits">
            Продолжить покупки
          </a>
          <a class="catalog-button" href="./favorites.html">
            Избранное
          </a>
          <a class="catalog-button" id="cart-auth-link" href="./index.html?auth=login" aria-disabled="true">
            Проверяем вход…
          </a>
        </div>
      </div>
    </div>
  </header>

  <nav class="mobile-nav" aria-label="Основная навигация">
    <a href="./index.html#top"><svg aria-hidden="true"><use href="#home"></use></svg><span>Главная</span></a>
    <a href="./index.html#hits"><svg aria-hidden="true"><use href="#grid"></use></svg><span>Каталог</span></a>
    <a href="./favorites.html"><svg aria-hidden="true"><use href="#heart"></use></svg><span>Избранное</span></a>
    <a href="./cart.html" aria-current="page"><svg aria-hidden="true"><use href="#bag"></use></svg><span>Корзина</span></a>
    <a href="./index.html?auth=login"><svg aria-hidden="true"><use href="#user"></use></svg><span>Войти</span></a>
  </nav>

  <main class="cart-page">
    <div class="container">
      <h1>Корзина</h1>

      <div id="cart-page-content" aria-live="polite" aria-busy="true">
        <p class="products-status">Проверяем авторизацию...</p>
      </div>
    </div>
  </main>
 <div id="footer-container"></div>
  <script src="./api.js"></script>
  <script src="./cart.js"></script>
  <footer class="site-footer">
    <div class="copyright">© 2026 «Золотая зебра». Все права защищены.</div>
  </footer>
</body>
</html>
