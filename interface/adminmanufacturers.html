```html
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Админ-панель — Золотая зебра</title>

  <link rel="stylesheet" href="./style.css">

  <style>
    .admin-header {
      padding: 56px 0 36px;
      text-align: center;
    }

    .admin-header h1 {
      margin: 10px 0 0;
      font-size: clamp(36px, 6vw, 64px);
    }

    .admin-header p {
      max-width: 680px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 18px;
    }

    /* Форма */

    .admin-form {
      margin-bottom: 56px;
      padding: 30px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .admin-form h2 {
      margin-top: 0;
      font-size: 30px;
    }

    .form-description {
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-field.full {
      grid-column: 1 / -1;
    }

    .form-field label {
      font-size: 13px;
      font-weight: 700;
    }

    .form-field input,
    .form-field textarea,
    .form-field select {
      width: 100%;
      padding: 12px 14px;

      color: var(--ink);
      background: #f5f2ed;

      border: 1px solid var(--border);
      border-radius: 10px;

      outline: none;
      font-family: inherit;
    }

    .form-field textarea {
      min-height: 130px;
      resize: vertical;
    }

    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-soft);
    }

    .form-submit {
      margin-top: 22px;
      padding: 13px 24px;

      color: #fff;
      background: var(--gold);

      border: 0;
      border-radius: 10px;

      font-weight: 700;
      cursor: pointer;

      transition: background .2s, transform .2s;
    }

    .form-submit:hover {
      background: var(--gold-dark);
      transform: translateY(-1px);
    }

    .form-message {
      margin-left: 12px;
      color: var(--gold-dark);
      font-size: 14px;
    }

    /* Список товаров */

    .products-section {
      padding-bottom: 56px;
    }

    .products-section h2 {
      margin-bottom: 20px;
      font-size: 30px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product-card {
      padding: 20px;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow: var(--shadow);

      transition: transform .2s, box-shadow .2s;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-large);
    }

    .product-image {
      height: 180px;
      margin-bottom: 18px;

      overflow: hidden;

      background: #eee;
      border-radius: 12px;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-name {
      margin: 0;
      font-family: var(--serif);
      font-size: 23px;
    }

    .product-category {
      margin-top: 6px;

      color: var(--gold-dark);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .product-description {
      margin: 12px 0;

      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-top: 16px;
      padding-top: 14px;

      border-top: 1px solid var(--border);
    }

    .product-price {
      color: var(--gold-dark);
      font-size: 20px;
      font-weight: 700;
    }

    .product-stock {
      color: var(--muted);
      font-size: 13px;
    }

    /* Адаптив */

    @media (max-width: 900px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .admin-header {
        padding: 36px 0 28px;
      }

      .admin-header p {
        font-size: 16px;
      }

      .admin-form {
        padding: 22px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-field.full {
        grid-column: auto;
      }

      .form-message {
        display: block;
        margin: 12px 0 0;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="container">

    <div class="header-main">

      <a class="brand" href="./index.html">

        <img
          class="brand-logo"
          src="../images/image.png"
          alt="Логотип Золотая зебра"
        >

        <span>
          <span class="brand-name">Золотая зебра</span>
          <span class="brand-caption">мебель</span>
        </span>

      </a>

      <nav class="page-links" aria-label="Основная навигация">
        <a href="./index.html">Главная</a>
        <a href="./manufacturers.html">Производители</a>
        <a class="active" href="./admin.html">Админ-панель</a>
      </nav>

    </div>

  </div>
</header>


<main>

  <div class="container">

    <!-- Заголовок -->

    <section class="admin-header">

      <div class="eyebrow">
        Управление магазином
      </div>

      <h1>
        Админ-панель
      </h1>

      <p>
        Добавляйте новые товары в каталог магазина
        «Золотая зебра».
      </p>

    </section>


    <!-- Форма добавления -->

    <section class="admin-form">

      <h2>
        Добавить товар
      </h2>

      <p class="form-description">
        Заполните информацию о новом товаре.
      </p>


      <form id="product-form">

        <div class="form-grid">

          <!-- Название -->

          <div class="form-field">

            <label for="product-name">
              Название товара
            </label>

            <input
              id="product-name"
              name="name"
              type="text"
              required
              placeholder="Например, Диван «Милан»"
            >

          </div>


          <!-- Цена -->

          <div class="form-field">

            <label for="product-price">
              Цена
            </label>

            <input
              id="product-price"
              name="price"
              type="number"
              min="0"
              required
              placeholder="59990"
            >

          </div>


          <!-- Категория -->

          <div class="form-field">

            <label for="product-category">
              Категория
            </label>

            <select
              id="product-category"
              name="categoryId"
              required
            >

              <option value="">
                Выберите категорию
              </option>

              <option value="1">
                Диваны
              </option>

              <option value="2">
                Кресла
              </option>

              <option value="3">
                Кровати
              </option>

              <option value="4">
                Шкафы
              </option>

              <option value="5">
                Столы
              </option>

              <option value="6">
                Стулья
              </option>

            </select>

          </div>


          <!-- Количество -->

          <div class="form-field">

            <label for="product-stock">
              Количество на складе
            </label>

            <input
              id="product-stock"
              name="stock"
              type="number"
              min="0"
              required
              placeholder="10"
            >

          </div>


          <!-- Изображение -->

          <div class="form-field full">

            <label for="product-image">
              Ссылка на изображение
            </label>

            <input
              id="product-image"
              name="image"
              type="url"
              placeholder="https://example.com/sofa.jpg"
            >

          </div>


          <!-- Описание -->

          <div class="form-field full">

            <label for="product-description">
              Описание
            </label>

            <textarea
              id="product-description"
              name="description"
              placeholder="Опишите характеристики и особенности товара"
            ></textarea>

          </div>

        </div>


        <button
          class="form-submit"
          type="submit"
        >
          Добавить товар
        </button>

        <span
          class="form-message"
          id="form-message"
        ></span>

      </form>

    </section>


    <!-- Список товаров -->

    <section class="products-section">

      <h2>
        Товары
      </h2>

      <div
        class="products-grid"
        id="products-list"
      ></div>

    </section>

  </div>

</main>


<footer class="site-footer">

  <div class="copyright">
    © 2026 «Золотая зебра». Все права защищены.
  </div>

</footer>
<script src="/logic/admin_panel.js"></script>
</body>
</html>
```
